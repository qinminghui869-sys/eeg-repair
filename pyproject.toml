[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-repair"
version = "0.1.0"
description = "Schema-preserving EEG Parquet preprocessing and spherical spline repair"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "mne>=1.6,<2", "scikit-learn>=1.3,<2", "pyarrow>=15,<26", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
eeg-repair = "eeg_repair.cli:main"
eeg-repair-inspect = "eeg_repair.inspection:main"
eeg-repair-qc = "eeg_repair.quality:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
